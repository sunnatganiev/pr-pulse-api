services:
  postgres:
    image: postgres:16-alpine
    container_name: pr-pulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-pr_pulse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pr_pulse}
      POSTGRES_DB: ${DB_NAME:-pr_pulse}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pr_pulse} -d ${DB_NAME:-pr_pulse}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
